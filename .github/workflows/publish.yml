name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm trusts this workflow in this repository and
      # issues the credential itself, from the OIDC token GitHub mints for the
      # run. There is no secret to store, to rotate, or to leak.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
      # The runner's npm predates trusted publishing, which landed in 11.5.1.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Provenance comes with trusted publishing; no --provenance needed, and
      # no NODE_AUTH_TOKEN.
      - run: npm publish --access public
