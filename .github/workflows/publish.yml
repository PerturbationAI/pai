name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Trusted publishing: npm trusts this workflow in this repository and
      # issues the credential itself, from the OIDC token GitHub mints for the
      # run. There is no secret to store, to rotate, or to leak.
      id-token: write
    steps:
      - uses: actions/checkout@v4
      # No `registry-url`: it writes an .npmrc line reading the auth token from
      # NODE_AUTH_TOKEN, and with no token to read it writes the placeholder
      # setup-node ships. npm then authenticates with that, is refused, and
      # never reaches the OIDC exchange -- a 404 on the publish, which is what
      # npm returns rather than say whether the package exists.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # The runner's npm predates trusted publishing, which landed in 11.5.1.
      - run: npm install -g npm@latest
      - run: npm --version
      - run: npm ci
      - run: npm test
      - run: npm run build
      # Provenance comes with trusted publishing; no --provenance needed, and
      # no NODE_AUTH_TOKEN.
      - run: npm publish --access public
